<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geodesic Sphere</title>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden}
canvas{display:block}
#info{position:absolute;top:16px;left:16px;color:#fff;font-family:'Courier New',monospace;font-size:14px;line-height:1.6;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.9)}
</style>
</head>
<body>
<div id="info">Loading...</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),gl=c.getContext('webgl');
if(!gl){document.getElementById('info').textContent='WebGL not supported';throw Error('no webgl')}
function resize(){c.width=innerWidth;c.height=innerHeight;gl.viewport(0,0,c.width,c.height)}
addEventListener('resize',resize);resize();

const phi=(1+Math.sqrt(5))/2;
function norm(v){const l=Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);return l?[v[0]/l,v[1]/l,v[2]/l]:[0,0,1]}
function mid(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2]}

const icoV=[
[0,1,phi],[0,1,-phi],[0,-1,phi],[0,-1,-phi],
[1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
[phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
].map(norm);

const icoF=[
[0,8,4],[0,2,8],[0,9,2],[0,5,9],[0,4,5],
[4,8,10],[8,2,6],[2,9,7],[9,5,11],[5,4,1],
[4,10,1],[5,1,11],[9,11,7],[2,7,6],[8,6,10],
[3,1,10],[3,11,1],[3,7,11],[3,6,7],[3,10,6]
];

function flat(verts,faces){return faces.map(f=>f.map(i=>[...verts[i]]))}

function subdiv(tris){
const r=[];
for(const[a,b,c]of tris){
const ab=norm(mid(a,b)),bc=norm(mid(b,c)),ca=norm(mid(c,a));
r.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);
}
return r;
}

function faceNormal(a,b,c){
const ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],ac=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
const n=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]];
const ct=[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3,(a[2]+b[2]+c[2])/3];
if(n[0]*ct[0]+n[1]*ct[1]+n[2]*ct[2]<0){n[0]=-n[0];n[1]=-n[1];n[2]=-n[2]}
const l=Math.sqrt(n[0]*n[0]+n[1]*n[1]+n[2]*n[2]);
return l?[n[0]/l,n[1]/l,n[2]/l]:[0,0,1];
}

function build(tris){
const v=[];
for(const t of tris){const n=faceNormal(t[0],t[1],t[2]);for(const p of t)v.push(p[0],p[1],p[2],n[0],n[1],n[2])}
return new Float32Array(v);
}

const levels=[];
let tris=flat(icoV,icoF);
for(let i=0;i<5;i++){levels.push({data:build(tris),count:tris.length*3});if(i<4)tris=subdiv(tris)}

const vs=`attribute vec3 aP;attribute vec3 aN;uniform mat4 uM;uniform mat3 uNM;varying vec3 vN;
void main(){gl_Position=uM*vec4(aP,1.0);vN=uNM*aN;}`;

const fs=`precision highp float;varying vec3 vN;uniform vec3 uL;
void main(){vec3 n=normalize(vN);vec3 l=normalize(uL);
float d=max(dot(n,l),0.0);float i=0.2+0.8*d;gl_FragColor=vec4(i,0.0,0.0,1.0);}`;

function mkShader(src,t){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const prg=gl.createProgram();
gl.attachShader(prg,mkShader(vs,gl.VERTEX_SHADER));
gl.attachShader(prg,mkShader(fs,gl.FRAGMENT_SHADER));
gl.linkProgram(prg);
if(!gl.getProgramParameter(prg,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prg));
gl.useProgram(prg);

const aP=gl.getAttribLocation(prg,'aP'),aN=gl.getAttribLocation(prg,'aN');
const uM=gl.getUniformLocation(prg,'uM'),uNM=gl.getUniformLocation(prg,'uNM'),uL=gl.getUniformLocation(prg,'uL');
gl.enableVertexAttribArray(aP);gl.enableVertexAttribArray(aN);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.vertexAttribPointer(aP,3,gl.FLOAT,false,24,0);
gl.vertexAttribPointer(aN,3,gl.FLOAT,false,24,12);
gl.uniform3f(uL,.5,1,.5);
gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,1);

function persp(fov,asp,near,far){const f=1/Math.tan(fov/2);
return new Float32Array([f/asp,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0])}

function lookAt(e,c,up){const f=norm([c[0]-e[0],c[1]-e[1],c[2]-e[2]]),upN=norm(up);
const s=norm([f[1]*upN[2]-f[2]*upN[1],f[2]*upN[0]-f[0]*upN[2],f[0]*upN[1]-f[1]*upN[0]]);
const u=[s[1]*f[2]-s[2]*f[1],s[2]*f[0]-s[0]*f[2],s[0]*f[1]-s[1]*f[0]];
return new Float32Array([s[0],s[1],s[2],-(s[0]*e[0]+s[1]*e[1]+s[2]*e[2]),
u[0],u[1],u[2],-(u[0]*e[0]+u[1]*e[1]+u[2]*e[2]),
-f[0],-f[1],-f[2],f[0]*e[0]+f[1]*e[1]+f[2]*e[2],0,0,0,1])}

function rotY(a){const c=Math.cos(a),s=Math.sin(a);
return new Float32Array([c,0,-s,0,0,1,0,0,s,0,c,0,0,0,0,1])}

function mul4(a,b){const c=new Float32Array(16);
for(let row=0;row<4;row++)for(let col=0;col<4;col++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+row]*b[col*4+k];c[col*4+row]=s}
return c}

const info=document.getElementById('info'),LD=12000,NL=5;
let curLvl=-1,startT=0;

function frame(t){
if(!startT)startT=t;
const el=t-startT,cycle=el%(NL*LD),lvl=Math.floor(cycle/LD);
if(lvl!==curLvl){curLvl=lvl;const l=levels[lvl];gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,l.data,gl.STATIC_DRAW);
info.textContent=`Level: ${lvl}\nFaces: ${l.count/3}\nVertices: ${l.data.length/6}`}
const asp=c.width/c.height,proj=persp(Math.PI/4,asp,.1,10),view=lookAt([0,0,3.5],[0,0,0],[0,1,0]);
const ang=t/1e3*.3,model=rotY(ang),mvp=mul4(proj,mul4(view,model));
gl.uniformMatrix4fv(uM,false,mvp);
const nm=new Float32Array([Math.cos(ang),0,-Math.sin(ang),0,1,0,Math.sin(ang),0,Math.cos(ang)]);
gl.uniformMatrix3fv(uNM,false,nm);
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLES,0,levels[curLvl].count);
requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script>
</body>
</html>
